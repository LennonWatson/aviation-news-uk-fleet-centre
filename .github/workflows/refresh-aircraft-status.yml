name: Refresh aircraft last-known data

on:
  workflow_dispatch:
  schedule:
    # Once daily to stay within the free adhoc API quota.
    # Increase frequency only if your adsb.lol key quota supports it.
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: aircraft-status-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect last-known observations
        env:
          ADSBLOL_API_KEY: ${{ secrets.ADSBLOL_API_KEY }}
          ADSBLOL_REQUEST_DELAY: "1.0"
        run: python scripts/refresh_aircraft_status.py

      - name: Commit refreshed database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aircraft-status.json
          git diff --cached --quiet || git commit -m "Refresh aircraft last-known database"
          git push
